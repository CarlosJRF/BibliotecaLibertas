<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Libertas</title>

    <!-- Bootstrap 5 CSS (incluido localmente en /assets/dependencies para no depender de un CDN externo) -->
    <link href="assets/dependencies/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- ===== Aplicación React: navegación, carrito, encabezado y catálogo ===== -->
    <div id="root"></div>

    <!-- ===== Pie de página ===== -->
    <footer id="contacto" class="bg-dark text-light py-4 mt-5">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
            <div class="contact-info text-center text-md-start">
                <p class="mb-1"><strong>Dirección:</strong> Av. de los Letrados 456, Región Metropolitana</p>
                <p class="mb-0"><strong>Email:</strong> contacto@bookstoreweb.cl</p>
            </div>

            <div class="social-media text-center text-md-end">
                <p class="mb-1">Síguenos en nuestras redes:</p>
                <ul class="list-inline mb-0">
                    <li class="list-inline-item"><a class="text-light" href="#">Instagram</a></li>
                    <li class="list-inline-item"><a class="text-light" href="#">Facebook</a></li>
                    <li class="list-inline-item"><a class="text-light" href="#">X (Twitter)</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS (incluye Popper, necesario para dropdown y offcanvas) -->
    <script src="assets/dependencies/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- React 18 + Babel standalone (incluidos localmente: transforman JSX en el navegador, sin paso de build) -->
    <script src="assets/dependencies/react/react.development.js"></script>
    <script src="assets/dependencies/react/react-dom.development.js"></script>
    <script src="assets/dependencies/react/babel.min.js"></script>

    <!-- Componentes de la aplicación (el orden importa: App.jsx va al final porque monta la app) -->
    <script type="text/babel" src="assets/js/components/utilidades.jsx"></script>
    <script type="text/babel" src="assets/js/components/TarjetaProducto.jsx"></script>
    <script type="text/babel" src="assets/js/components/ListaProductos.jsx"></script>
    <script type="text/babel" src="assets/js/components/Carrito.jsx"></script>
    <script type="text/babel" src="assets/js/components/BarraNavegacion.jsx"></script>
    <script type="text/babel" src="assets/js/components/App.jsx"></script>
</body>
</html>
